name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Exact 40-character commit SHA already built and verified in test'
        required: true

env:
  AZURE_RG: wanderlisted-rg
  ACR_NAME: wanderlistedacr

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine immutable image SHA
        id: image
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            image_sha=$(git rev-list -n 1 "${{ github.event.release.tag_name }}")
          else
            image_sha="${{ github.event.inputs.image_sha }}"
          fi
          [[ "${image_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${image_sha}" >> "${GITHUB_OUTPUT}"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Resolve and verify test-built image digests
        id: digests
        run: |
          api_digest=$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "wanderlisted-api:${{ steps.image.outputs.sha }}" \
            --query digest \
            --output tsv)
          frontend_digest=$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "wanderlisted-frontend:${{ steps.image.outputs.sha }}" \
            --query digest \
            --output tsv)
          [[ "${api_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${frontend_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "api_digest=${api_digest}" >> "${GITHUB_OUTPUT}"
          echo "frontend_digest=${frontend_digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy infrastructure
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RG }}
          template: ./infra/main.bicep
          parameters: ./infra/parameters.prod.bicepparam
          additionalArguments: >-
            --parameters
            apiImageDigest=${{ steps.digests.outputs.api_digest }}
            frontendImageDigest=${{ steps.digests.outputs.frontend_digest }}
            checkpointDatabaseUrl='${{ secrets.CHECKPOINT_DATABASE_URL }}'
            sessionSigningKey='${{ secrets.SESSION_SIGNING_KEY }}'

      - name: Update API secrets
        run: |
          az containerapp secret set \
            --name wanderlisted-api \
            --resource-group ${{ env.AZURE_RG }} \
            --secrets \
              azure-openai-key=${{ secrets.AZURE_OPENAI_API_KEY }} \
              azure-openai-endpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }} \
              duffel-token=${{ secrets.DUFFEL_ACCESS_TOKEN }} \
              google-maps-key=${{ secrets.GOOGLE_MAPS_API_KEY }} \
              tavily-key=${{ secrets.TAVILY_API_KEY }} \
              hotelbeds-key=${{ secrets.HOTELBEDS_API_KEY }} \
              hotelbeds-secret=${{ secrets.HOTELBEDS_API_SECRET }}

      - name: Set API environment variables
        run: |
          az containerapp update \
            --name wanderlisted-api \
            --resource-group ${{ env.AZURE_RG }} \
            --set-env-vars \
              AZURE_OPENAI_API_KEY=secretref:azure-openai-key \
              AZURE_OPENAI_ENDPOINT=secretref:azure-openai-endpoint \
              AZURE_OPENAI_DEPLOYMENT_NAME=${{ vars.AZURE_OPENAI_DEPLOYMENT_NAME }} \
              AZURE_OPENAI_API_VERSION=${{ vars.AZURE_OPENAI_API_VERSION }} \
              DUFFEL_ACCESS_TOKEN=secretref:duffel-token \
              GOOGLE_MAPS_API_KEY=secretref:google-maps-key \
              TAVILY_API_KEY=secretref:tavily-key \
              HOTELBEDS_API_KEY=secretref:hotelbeds-key \
              HOTELBEDS_API_SECRET=secretref:hotelbeds-secret \
              LLM_PROVIDER=azure_openai \
              ENVIRONMENT=prod
