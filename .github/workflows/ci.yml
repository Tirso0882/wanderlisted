name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  DUFFEL_ACCESS_TOKEN: "duffel_test_fake"
  GOOGLE_MAPS_API_KEY: "test"
  AZURE_OPENAI_API_KEY: "test"
  AZURE_OPENAI_ENDPOINT: "https://test.openai.azure.com"
  AZURE_OPENAI_DEPLOYMENT_NAME: "test"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
  TAVILY_API_KEY: "test"
  EDD_REFRESH: "0"
  EDD_LIVE_JUDGE_APPROVED: "0"
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"
  UV_VERSION: "0.11.7"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 0: Secret scanning — block commits containing API keys/tokens
  # ──────────────────────────────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # Job 1: Lint + format — fast fail on code style
  # ──────────────────────────────────────────────────────────────────
  lint:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff check src/ tests/ scripts/ edd/
      - run: uv run --frozen ruff format --check src/ tests/ scripts/ edd/

  # ──────────────────────────────────────────────────────────────────
  # Documentation contracts — deterministic and provider-free
  # ──────────────────────────────────────────────────────────────────
  docs:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen python scripts/docs/check_docs.py
      - run: uv run --frozen pytest tests/test_docs_contract.py -q
      - run: uv run --frozen ruff check scripts/docs/ tests/test_docs_contract.py
      - run: uv run --frozen ruff format --check scripts/docs/ tests/test_docs_contract.py
      - run: uv run --frozen python -m compileall -q scripts/docs/

  # ──────────────────────────────────────────────────────────────────
  # Job 2: Unit tests + coverage — fail-fast, 80% minimum
  # ──────────────────────────────────────────────────────────────────
  test:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest tests/ -x --tb=short -q -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=80

  # ──────────────────────────────────────────────────────────────────
  # Job 3: Layer 1 evaluators — code-based, deterministic, free
  # Validates routing, budget completeness, handbook sections
  # ──────────────────────────────────────────────────────────────────
  eval-layer1:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest tests/test_evaluators.py tests/test_edd_*.py tests/test_readiness_evaluation_dataset.py -x --tb=short -q
      - run: uv run --frozen python -m edd.budget.l1_run
      - run: uv run --frozen python -m edd.itinerary.l1_run
      - run: uv run --frozen python -m edd.offline_baselines verify

  # ──────────────────────────────────────────────────────────────────
  # Frontend — frozen dependencies, lint, type-check, production build
  # ──────────────────────────────────────────────────────────────────
  frontend:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm exec tsc --noEmit
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  # ──────────────────────────────────────────────────────────────────
  # Job 4: Docker build dry-run — catch Dockerfile issues on PRs
  # ──────────────────────────────────────────────────────────────────
  docker-build:
    needs: [lint, test, eval-layer1, docs, frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v5
        with:
          push: false
          tags: wanderlisted:pr-${{ github.event.pull_request.number }}

  # ──────────────────────────────────────────────────────────────────
  # Job 5: Build + push Docker image (main branch only)
  # ──────────────────────────────────────────────────────────────────
  build-and-push:
    needs: [lint, test, eval-layer1, docs, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
