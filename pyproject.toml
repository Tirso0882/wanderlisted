[project]
name = "wanderlisted"
version = "0.2.0"
description = "Multi-agent AI travel itinerary planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "langchain>=1.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "langsmith>=0.2.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "redis>=5.0,<7.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.30.0",
    "lingua-language-detector>=2.1,<3",
]

[dependency-groups]
dev = [
    "langgraph-api>=0.11.0,<0.12.0",
    "langgraph-cli[inmem]>=0.4.31,<0.5.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff==0.15.10",
    "truststore>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call live external APIs (deselected by default; run explicitly with -m integration)",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/api/*",
    "src/agent/agent.py",          # Stage 1 entrypoint — imports LLM at module level
    "src/agent/graph.py",          # LangGraph Studio entrypoint — imports LLM at module level
    "src/agent/llm.py",            # LLM factory — config glue, each branch needs real provider SDK
    "src/agent/renderer.py",       # HTML rendering — no business logic
    "src/evaluation/golden_dataset.py",  # Pure data, no logic
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
required-version = "==0.15.10"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]                 # Line length handled by formatter, not linter

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]        # Re-exports in package __init__ files
"scripts/*" = ["E402"]          # Scripts use sys.path / load_dotenv before imports
"edd/*" = ["E402"]              # EDD files use sys.path / load_dotenv before imports
