logging:
  level: INFO
  log_format: "%(asctime)s  %(levelname)-8s  %(name)s  %(message)s"
  datefmt: "%H:%M:%S"
  use_colors: true

  console:
    enabled: true
    level: INFO

  file:
    enabled: true
    base_path: "logs"
    level: DEBUG

# ── Travel-readiness research (Tavily + Open-Meteo) ──────────────────────
travel_readiness:
  max_queries: 6
  max_results_per_query: 5
  concurrency: 4
  timeout_seconds: 15
  max_retries: 3
  cache_ttl_seconds: 21600
  cache_max_size: 200
  weather:
    timeout_seconds: 10
    max_retries: 2
    forecast_horizon_days: 16
    cache_ttl_seconds: 3600
  official_sources:
    safety_by_origin:
      united states: travel.state.gov
      us: travel.state.gov
      united kingdom: gov.uk
      uk: gov.uk
      poland: gov.pl
      polska: gov.pl
      colombia: cancilleria.gov.co
      kolumbia: cancilleria.gov.co
    safety_fallback:
      - travel.state.gov
      - gov.uk
    weather:
      - worldweather.wmo.int
    health:
      - who.int
      - cdc.gov
    # Trusted official visitor authorities. These label returned evidence as
    # official without restricting broader culture/etiquette searches.
    culture_authorities:
      - gotokyo.org
      - japan.travel
    # Add official destination-government domains before emitting these facts.
    visa: []
    emergency: []

# ── Routing ──────────────────────────────────────────────────────────────
routing:
  # Discovery agents run concurrently. TravelReadinessAgent is listed here for
  # routing compatibility but the graph completes it before discovery so its
  # grounded constraints are available to the remaining workers.
  parallel_agents:
    - FlightsAgent
    - TravelReadinessAgent
    - RestaurantsAgent
    - ActivitiesAgent

  # Dependency-owned stages after initial discovery (order matters).
  # Hotels requires exact TripSkeleton stays; Transportation requires selections.
  sequential_agents:
    - HotelsAgent
    - TransportationAgent
    - BudgetAgent
    - ItineraryAgent

# ── Tool timeouts (seconds) ──────────────────────────────────────────────
timeouts:
  google_maps: 15
  directions: 15
  distance_matrix: 15
  routes: 25
  flights: 30
  hotels: 30
  currency: 10

# ── HITL Gates ───────────────────────────────────────────────────────────
# Toggle human-in-the-loop interrupt gates.
# Override per-gate via env: HITL_BUDGET_REVIEW=false, HITL_HUMAN_REVIEW=false.
hitl:
  budget_review: true
  human_review: false

# ── Budget policy ────────────────────────────────────────────────────────
budget:
  reserve_recommendation_percent: 10
  review_overage_percent: 10
  review_overage_floor_usd: 100
  exchange_rate_cache_ttl_seconds: 3600

# ── API ──────────────────────────────────────────────────────────────────
api:
  version: "2.0.0"
  cors_origins:
    - "http://localhost:3000"
